<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { --accent: #2a82da; --text: #ffffff; --text-muted: #dddddd; }
        body { margin: 0; color: var(--text); font-family: system-ui, sans-serif; background: url('qrc:/background.png') no-repeat center center fixed; background-size: cover; }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); z-index: -1; }

        .navbar { background-color: rgba(15, 15, 15, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .nav-links a { color: var(--text-muted); cursor: pointer; margin-right: 20px; font-weight: bold; transition: 0.2s; text-decoration: none; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        .view { display: none; }
        .view.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card { background-color: rgba(30, 30, 30, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card:hover { transform: translateY(-5px); background-color: rgba(50, 50, 50, 0.6); }
        .card img { width: 100%; height: 140px; object-fit: cover; background: rgba(0,0,0,0.5); }
        .card-content { padding: 15px; }
        .card-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        
        .glass-panel { background-color: rgba(20, 20, 20, 0.5); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; box-shadow: 0 4px 30px rgba(0,0,0,0.4); }

        .btn { background: rgba(42, 130, 218, 0.8); backdrop-filter: blur(5px); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: rgba(42, 130, 218, 1); transform: scale(1.05); }
        .btn-installed { background: rgba(39, 174, 96, 0.8); }
        
        textarea, input { width: 100%; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 15px; font-family: monospace; border-radius: 8px; box-sizing: border-box; font-size: 14px; margin-bottom: 20px;}
        textarea:focus, input:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.6); }

        .gallery { display: flex; overflow-x: auto; gap: 20px; padding: 10px 0; }
        .gallery img { height: 250px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div class="navbar">
        <div style="font-size: 20px; font-weight: 900; letter-spacing: 1px;">100% TITAN <span style="color: var(--accent)">STORE</span></div>
        <div class="nav-links">
            <a id="tab-store" class="active" onclick="switchView('store')">🌐 Discover</a>
            <a id="tab-installed" onclick="switchView('installed')">💻 Downloaded</a>
            <a id="tab-settings" onclick="switchView('settings')">&#9881; Settings</a>
        </div>
    </div>

    <div class="container">
        <div id="view-store" class="view active">
            <div id="store-grid" class="grid"><h2>Loading Store...</h2></div>
        </div>

        <div id="view-installed" class="view">
            <h2 style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Downloaded Apps</h2>
            <div id="installed-grid" class="grid"></div>
        </div>

        <div id="view-details" class="view">
            <div class="glass-panel">
                <a onclick="switchView('store')" style="color:#ddd; cursor:pointer; font-weight: bold; text-decoration: none;">&#11013; Back to Store</a><br><br>
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <h1 id="det-title" style="margin:0; text-shadow: 0 2px 5px rgba(0,0,0,0.5);"></h1>
                        <p id="det-info" style="color:#ccc; font-size: 14px; margin-top: 5px;"></p>
                    </div>
                    <button id="det-btn" class="btn" onclick="installCurrentApp()">Download & Mount</button>
                </div>
                <p id="det-desc" style="font-size:16px; margin: 30px 0; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,0.8);"></p>
                <h3 style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Screenshots</h3>
                <div id="det-gallery" class="gallery"></div>
            </div>
        </div>

        <div id="view-settings" class="view">
            <div class="glass-panel">
                <h2 style="margin-top:0;">Store Settings</h2>
                
                <p style="color:#ccc; font-weight: bold;">Download Folder Path (for DMGs):</p>
                <input type="text" id="settings-path" placeholder="/Users/username/Downloads/TITAN_STORE_TEMP">

                <p style="color:#ccc; font-weight: bold;">Store Sources (One JSON URL per line):</p>
                <textarea id="settings-urls" style="height: 100px;"></textarea>
                
                <button class="btn" onclick="saveSettings()">💾 Save & Reload</button>
            </div>
        </div>
    </div>

    <script>
        let currentAppId = "";

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(document.getElementById('tab-' + viewName)) {
                document.getElementById('tab-' + viewName).classList.add('active');
            }
        }

        function renderStore(apps, instIds) {
            let storeHtml = "";
            let installedHtml = "";

            apps.forEach(app => {
                const img = app.screenshots && app.screenshots.length > 0 ? app.screenshots[0] : "https://via.placeholder.com/250x140";
                const isInst = instIds.includes(app.id);
                const badge = isInst ? "<span style='float:right; color:#27ae60; text-shadow: 0 0 5px #27ae60;'>&#9989;</span>" : "";
                
                const card = `
                    <div class="card" onclick="openDetails('${app.id}')">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/250x140';">
                        <div class="card-content">
                            <p class="card-title">${app.title} ${badge}</p>
                            <p style="color:#ccc; font-size:12px; margin:0;">${app.developer}</p>
                        </div>
                    </div>`;
                
                storeHtml += card;
                if(isInst) installedHtml += card;
            });

            document.getElementById('store-grid').innerHTML = storeHtml || "<h2>No apps found in sources.</h2>";
            document.getElementById('installed-grid').innerHTML = installedHtml || "<h2>No apps downloaded yet.</h2>";
        }

        function loadSettings(settingsObj) {
            document.getElementById('settings-urls').value = settingsObj.urls.join("\n");
            document.getElementById('settings-path').value = settingsObj.installPath;
        }

        function showAppDetails(app, isInstalled) {
            currentAppId = app.id;
            
            document.getElementById('det-title').innerHTML = `${app.title} <span style="font-size:16px; color:#aaa;">v${app.version}</span>`;
            document.getElementById('det-info').innerText = `${app.developer} • ${app.size} • ${app.copyright}`;
            document.getElementById('det-desc').innerText = app.description;
            
            const btn = document.getElementById('det-btn');
            if(isInstalled) {
                btn.innerText = "Mounted";
                btn.className = "btn btn-installed";
            } else {
                btn.innerText = "Download & Mount";
                btn.className = "btn";
            }

            let screens = "";
            if(app.screenshots) {
                app.screenshots.forEach(img => { screens += `<img src="${img}">`; });
            }
            document.getElementById('det-gallery').innerHTML = screens;

            switchView('details');
        }

        function openDetails(appId) {
            window.location.href = "app://details?data=" + encodeURIComponent(appId);
        }

        function installCurrentApp() {
            window.location.href = "app://install?data=" + encodeURIComponent(currentAppId);
            document.getElementById('det-btn').innerText = "Downloading...";
        }

        function saveSettings() {
            const urlsText = document.getElementById('settings-urls').value;
            const pathText = document.getElementById('settings-path').value;
            
            const payload = JSON.stringify({ urls: urlsText, path: pathText });
            window.location.href = "app://saveSettings?data=" + encodeURIComponent(payload);
            
            switchView('store');
            document.getElementById('store-grid').innerHTML = "<h2>Loading Store...</h2>";
        }
    </script>
</body>
</html>
